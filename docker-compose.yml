services:
  rental-query:
    build: .
    command: python -m services.rental_query.app
    ports: [ "8000:8000" ]
    env_file: .env
    environment:
      - RENTAL_QUERY_DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/postgres
      - RENTAL_QUERY_PRICING_URL=http://pricing:9000
    depends_on:
      - postgres
      - pricing

  rental-api:
    build: .
    command: python -m services.rental_api.app
    ports: [ "8080:8000" ]
    env_file: .env
    environment:
      - RENTAL_API_DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/postgres

  pricing:
    build: .
    command: python -m services.pricing.app
    ports: ["9000:9000"]
    env_file: .env
    environment:
      - PRICING_REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  stubs:
    build: .
    command: python -m services.stubs.app
    ports: [ "3629:3629" ]

  postgres:
    image: postgres:17
    ports: [ "5432:5432" ]
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
      - PGDATA=/data/postgres
    volumes:
      - ./.local/pg_data:/data/postgres

  redis:
    image: redis:latest
    restart: always
    ports: [ "6379:6379" ]
    volumes:
      - ./.local/redis_data:/data

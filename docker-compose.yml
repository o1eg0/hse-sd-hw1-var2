services:
  rental-query:
    build: .
    command: python -m services.rental_query.app
    ports: [ "8000:8000" ]
    env_file: .env
    environment:
      - RENTAL_QUERY_DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/postgres
      - RENTAL_QUERY_PRICING_URL=http://pricing:9000
    depends_on:
      postgres:
        condition: service_healthy
      pricing:
        condition: service_started

  rental-api:
    build: .
    command: bash -c 'alembic upgrade head && python -m services.rental_api.app'
    ports: [ "8080:8080" ]
    env_file: .env
    environment:
      - RENTAL_API_DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/postgres
      - RENTAL_QUERY_PRICING_URL=http://pricing:9000
    depends_on:
      postgres:
        condition: service_healthy
      pricing:
        condition: service_started
      rental-query:
        condition: service_started

  pricing:
    build: .
    command: python -m services.pricing.app
    ports: ["9000:9000"]
    env_file: .env
    environment:
      - PRICING_REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  stubs:
    build: .
    command: python -m services.stubs.app
    ports: [ "3629:3629" ]

  postgres:
    image: postgres:17
    ports: [ "5432:5432" ]
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
      - PGDATA=/data/postgres
    volumes:
      - ./.local/pg_data:/data/postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    restart: always
    ports: [ "6379:6379" ]
    volumes:
      - ./.local/redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

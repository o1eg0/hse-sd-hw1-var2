x-airflow-common: &airflow-common
  image: apache/airflow:2.10.2-python3.11
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
    AIRFLOW__CORE__FERNET_KEY: 4XbEoZ2qxd6QbaO5jM90_XzGyF_QwIVlY5PjaVXrDMY=
    AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: UTC
    AIRFLOW_CONN_DWH_POSTGRES: postgresql+psycopg2://postgres:postgres@postgres:5432/postgres
    _PIP_ADDITIONAL_REQUIREMENTS: ""
  volumes:
    - ./dwh/airflow/dags:/opt/airflow/dags
    - ./dwh/airflow/logs:/opt/airflow/logs
    - ./dwh/airflow/plugins:/opt/airflow/plugins
    - ./dwh/sample_data:/opt/airflow/sample_data
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    - airflow-db
    - postgres

services:
  rental-query:
    build: .
    command: python -m services.rental_query.app
    ports: [ "8000:8000" ]
    env_file: .env
    environment:
      - RENTAL_QUERY_DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/postgres
      - RENTAL_QUERY_PRICING_URL=http://pricing:9000
    depends_on:
      - postgres
      - pricing
    labels:
      logging: "promtail"

  rental-api:
    build: .
    command: bash -c 'alembic upgrade head && python -m services.rental_api.app'
    ports: [ "8080:8080" ]
    env_file: .env
    environment:
      - RENTAL_API_DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/postgres
      - RENTAL_QUERY_PRICING_URL=http://pricing:9000
    depends_on:
      - postgres
      - pricing
      - rental-query
    labels:
      logging: "promtail"

  pricing:
    build: .
    command: python -m services.pricing.app
    ports: ["9000:9000"]
    env_file: .env
    environment:
      - PRICING_REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    labels:
      logging: "promtail"

  stubs:
    build: .
    command: python -m services.stubs.app
    ports: [ "3629:3629" ]

  postgres:
    image: postgres:17
    ports: [ "5432:5432" ]
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
      - PGDATA=/data/postgres
    volumes:
      - ./.local/pg_data:/data/postgres

  redis:
    image: redis:latest
    restart: always
    ports: [ "6379:6379" ]
    volumes:
      - ./.local/redis_data:/data

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:latest
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"

  promtail:
    image: grafana/promtail:latest
    volumes:
      - ./observability/promtail-config.yml:/etc/promtail/config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./observability/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - ./observability/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      - ./observability/grafana/dashboards:/etc/grafana/provisioning/dashboards_files
    depends_on:
      - prometheus
      - loki

  airflow-db:
    image: postgres:16
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    ports:
      - "5433:5432"
    volumes:
      - ./.local/airflow_db:/var/lib/postgresql/data

  airflow-init:
    <<: *airflow-common
    command: >
      bash -c "airflow db migrate &&
               airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true"
    depends_on:
      - airflow-db
      - postgres
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 5
    depends_on:
      - airflow-db
      - airflow-init
      - postgres

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      - airflow-db
      - airflow-init
      - postgres

services:
  rental-query:
    build: .
    command: python -m services.rental_query.app
    ports: [ "8000:8000" ]
    env_file: .env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - HTTP_BACKEND_HOST=0.0.0.0
      - HTTP_BACKEND_PORT=8000

  rental-api:
    build: .
    command: python -m services.rental_api.app
    ports: [ "8080:8000" ]
    env_file: .env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - HTTP_BACKEND_HOST=0.0.0.0
      - HTTP_BACKEND_PORT=8000

  pricing:
    build: .
    command: python -m services.pricing.app
    ports: ["9000:9000"]
    env_file: .env
    environment:
      - PRICING_REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  stubs:
    build: .
    command: python -m services.stubs.app
    ports: [ "3629:3629" ]

  postgres:
    image: postgres:17
    ports: [ "5432:5432" ]
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
      - PGDATA=/data/postgres
    volumes:
      - ./.local/pg_data:/data/postgres

  redis:
    image: redis:latest
    restart: always
    ports: [ "6379:6379" ]
    volumes:
      - ./.local/redis_data:/data
